<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未完了タスク Kanban</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #1a1d21;
    --sub: #5f6b7a;
    --line: #dfe3e8;
    --waiting: #b7791f;
    --doing: #1f6feb;
    --hold: #6e7781;
    --done: #1a7f37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 16px 16px 8px;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: var(--sub); font-size: 13px; margin-bottom: 10px; }
  .meta strong { color: var(--ink); }
  #filter {
    width: 100%;
    max-width: 420px;
    padding: 8px 10px;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
  }
  main {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(270px, 86vw);
    gap: 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 12px 16px 24px;
    max-width: 1400px;
    margin: 0 auto;
    align-items: start;
  }
  @media (min-width: 1100px) {
    main {
      grid-auto-flow: initial;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-columns: initial;
      overflow-x: visible;
      scroll-snap-type: none;
    }
  }
  section.col {
    scroll-snap-align: start;
    background: #eceff2;
    border-radius: 10px;
    padding: 10px;
    min-height: 120px;
  }
  section.col h2 {
    font-size: 14px;
    margin: 2px 2px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .waiting .dot { background: var(--waiting); }
  .doing .dot { background: var(--doing); }
  .hold .dot { background: var(--hold); }
  .done .dot { background: var(--done); }
  .count {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--sub);
    border-radius: 999px;
    font-size: 12px;
    padding: 0 8px;
    line-height: 18px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(27, 31, 36, 0.06);
  }
  .card .title { font-weight: 600; font-size: 14px; line-height: 1.45; }
  .card .detail { color: var(--sub); font-size: 13px; line-height: 1.55; margin-top: 4px; }
  .done .card { opacity: 0.75; }
  .empty { color: var(--sub); font-size: 13px; padding: 4px 2px; }
  .error { color: #b42318; padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>未完了タスク Kanban</h1>
  <div class="meta" id="meta">読み込み中…</div>
  <input id="filter" type="search" placeholder="カードを絞り込み" autocomplete="off">
</header>
<main id="board"></main>
<script>
(function () {
  var board = document.getElementById('board');
  var meta = document.getElementById('meta');
  var filter = document.getElementById('filter');
  var data = null;

  function render() {
    var q = filter.value.trim().toLowerCase();
    board.textContent = '';
    var openTotal = 0;
    data.columns.forEach(function (col) {
      var sec = document.createElement('section');
      sec.className = 'col ' + col.id;
      var h = document.createElement('h2');
      var dot = document.createElement('span');
      dot.className = 'dot';
      h.appendChild(dot);
      h.appendChild(document.createTextNode(col.label));
      var count = document.createElement('span');
      count.className = 'count';
      count.textContent = col.cards.length;
      h.appendChild(count);
      sec.appendChild(h);
      var shown = 0;
      col.cards.forEach(function (card) {
        if (q && (card.title + ' ' + card.detail).toLowerCase().indexOf(q) === -1) return;
        shown++;
        var el = document.createElement('div');
        el.className = 'card';
        var t = document.createElement('div');
        t.className = 'title';
        t.textContent = card.title;
        var d = document.createElement('div');
        d.className = 'detail';
        d.textContent = card.detail;
        el.appendChild(t);
        el.appendChild(d);
        sec.appendChild(el);
      });
      if (shown === 0) {
        var e = document.createElement('div');
        e.className = 'empty';
        e.textContent = q ? '該当なし' : 'なし';
        sec.appendChild(e);
      }
      board.appendChild(sec);
      if (col.id !== 'done') openTotal += col.cards.length;
    });
    meta.textContent = '';
    meta.appendChild(document.createTextNode('未完了 '));
    var strong = document.createElement('strong');
    strong.textContent = openTotal + '件';
    meta.appendChild(strong);
    meta.appendChild(document.createTextNode('（' + data.updated + ' 時点）'));
  }

  filter.addEventListener('input', render);

  fetch('data.json', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (json) {
      data = json;
      render();
    })
    .catch(function (err) {
      meta.textContent = '';
      var div = document.createElement('div');
      div.className = 'error';
      div.textContent = 'data.json の読み込みに失敗しました: ' + err.message;
      board.appendChild(div);
    });
})();
</script>
</body>
</html>
